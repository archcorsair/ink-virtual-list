name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests (ink ${{ matrix.ink }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ink: ['6', '7']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install ink 7
      if: matrix.ink == '7'
      run: bun add -d ink@^7.1.1

    - name: Run tests
      run: bun test --only-failures

    - name: Typecheck
      run: bun run typecheck

    - name: Lint
      if: matrix.ink == '6'
      run: bun run lint
