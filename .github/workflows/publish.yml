name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --only-failures

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(bun --print 'require("./package.json").version')"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Sync jsr.json version from package.json
        run: bun run sync:jsr

      # JSR publishes src/ directly, so no build step is needed here. --allow-dirty is
      # required because the sync step above may leave jsr.json modified in the tree.
      - name: Publish to JSR
        run: bunx jsr publish --allow-dirty

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public

      - name: Verify both registries serve the tagged version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm_ok=0
          jsr_ok=0
          for attempt in 1 2 3 4 5; do
            if [ "$npm_ok" -eq 0 ]; then
              if curl -fsSL "https://registry.npmjs.org/ink-virtual-list" \
                | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null 2>&1; then
                npm_ok=1
                echo "npm serves $VERSION"
              fi
            fi
            if [ "$jsr_ok" -eq 0 ]; then
              if curl -fsSL "https://jsr.io/@archcorsair/ink-virtual-list/meta.json" \
                | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null 2>&1; then
                jsr_ok=1
                echo "jsr serves $VERSION"
              fi
            fi
            if [ "$npm_ok" -eq 1 ] && [ "$jsr_ok" -eq 1 ]; then
              echo "Both registries serve $VERSION"
              exit 0
            fi
            echo "attempt $attempt: npm_ok=$npm_ok jsr_ok=$jsr_ok - retrying in 10s"
            sleep 10
          done
          echo "::error::Registry verification failed for $VERSION (npm_ok=$npm_ok jsr_ok=$jsr_ok)"
          exit 1
