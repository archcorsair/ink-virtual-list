name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  # Runs all third-party code (installs, tests) in a job that cannot mint OIDC tokens.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --only-failures

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # The `version` lifecycle script syncs jsr.json into the version commit, so a
      # mismatch here means the tag was created outside the normal bump flow.
      - name: Verify tag matches package.json and jsr.json versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(bun --print 'require("./package.json").version')"
          JSR_VERSION="$(bun --print 'require("./jsr.json").version')"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION jsr.json=$JSR_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$JSR_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package.json ($PKG_VERSION) and jsr.json ($JSR_VERSION). Bump with 'bun run version:*' so the version lifecycle hook syncs jsr.json into the tagged commit."
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with npm and JSR.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"

      # npm publishes first: if the second publish fails, the primary registry is the
      # complete one. Each publish skips if its registry already has the version, so a
      # workflow re-run finishes whichever half is missing instead of failing on the
      # half that succeeded.
      - name: Publish to npm (OIDC + provenance)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "ink-virtual-list@$VERSION" version >/dev/null 2>&1; then
            echo "npm already serves $VERSION - skipping"
          else
            npm publish --provenance --access public
          fi

      # JSR publishes src/ directly from the tagged tree, so no build step is needed.
      - name: Publish to JSR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsSL "https://jsr.io/@archcorsair/ink-virtual-list/meta.json" \
            | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null 2>&1; then
            echo "jsr already serves $VERSION - skipping"
          else
            bunx jsr publish
          fi

      - name: Verify both registries serve the tagged version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm_ok=0
          jsr_ok=0
          # Registry metadata propagation can lag over a minute after a successful
          # publish (observed with JSR's meta.json on v0.3.0), so allow up to 5 minutes.
          for attempt in $(seq 1 30); do
            if [ "$npm_ok" -eq 0 ]; then
              if curl -fsSL "https://registry.npmjs.org/ink-virtual-list" \
                | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null 2>&1; then
                npm_ok=1
                echo "npm serves $VERSION"
              fi
            fi
            if [ "$jsr_ok" -eq 0 ]; then
              if curl -fsSL "https://jsr.io/@archcorsair/ink-virtual-list/meta.json" \
                | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null 2>&1; then
                jsr_ok=1
                echo "jsr serves $VERSION"
              fi
            fi
            if [ "$npm_ok" -eq 1 ] && [ "$jsr_ok" -eq 1 ]; then
              echo "Both registries serve $VERSION"
              exit 0
            fi
            echo "attempt $attempt: npm_ok=$npm_ok jsr_ok=$jsr_ok - retrying in 10s"
            sleep 10
          done
          echo "::error::Registry verification failed for $VERSION (npm_ok=$npm_ok jsr_ok=$jsr_ok)"
          exit 1
